version: 2
updates:
  - package-ecosystem: "bun"
    directories: 
      - "/packages/**/*"
      - "/plugins/**/*"
      - "/app/"
      - "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
