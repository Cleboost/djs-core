name: CI
permissions:
  contents: read

on:
  push:
    paths:
      - 'packages/**'
      - 'plugins/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'tsconfig.json'
      - 'biome.json'
    
jobs:
  build:
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2

      - run: bun i
      - run: bun run build
  test:
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2

      - run: bun i
      - run: bun run build
      - run: bun test
  knip:
    concurrency:
      group: knip-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2

      - run: bun i
      - run: bun knip
  biome:
    if: ${{ !startsWith(github.ref_name, 'dependabot/') }}
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2

      - run: bun i
      - run: bun check --write
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: apply biome fixes"
